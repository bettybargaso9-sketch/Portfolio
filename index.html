<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Management System - Blue & Purple Edition</title>
    <style>
        /* ==========================================================================
           1. COSMIC PURPLE BACKGROUND & BASE LAYOUT
           ========================================================================== */
        :root {
            --primary-glow: #3b82f6;     /* Radiant Royal Blue */
            --accent-blue: #2563EB;      /* Vivid Blue Accent */
            --deep-blue: #2051DE;        /* Deep #4460B6Blue */
            --text-dark: #373DCAFC;        /* Slate 800 */
            --text-muted: #000000;       /* Slate 500 */
            --success-color: #000000;
            --danger-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            /* Vibrant Cosmic Purple Gradient Background */
            background: radial-gradient(circle at 10% 20%, #50279C 0%, #1e1b4b 90%);
            color: var(--text-dark);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glowing background blobs - soft purple/blue highlights */
        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.2) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(12, 69, 193, 1) 0%, rgba(0, 100, 221, 1) 70%);
            bottom: -150px;
            right: -100px;
            z-index: 0;
        }

        /* ==========================================================================
           2. CRISP WHITE CONTAINER (White Theme Card)
           ========================================================================== */
        .container {
            width: 100%;
            max-width: 850px;
            background: #FFFFFF; /* Solid Crisp White Theme */
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(208, 99, 189, 1);
   rgba(233, 25, 166, 1)         box-shadow: 0 20px 50px rgba(0, 139, 220, 1), 
                        0 0 30px rgba(37, 99, 235, 0.2);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #1e293b 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: var(--accent-blue);
            margin-bottom: 35px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ==========================================================================
           3. ALERT MESSAGE CONTAINER
           ========================================================================== */
        #alert-container {
            min-height: 45px;
            margin-bottom: 20px;
        }

        .alert {
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.1);
            color: #065f46;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .alert-danger {
            background-color: rgba(239, 68, 68, 0.08);
            color: #991b1b;
            border: 1px solid rgba(239, 68, 68, 0.15);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           4. WHITE FORM PANEL & BLUE INPUTS
           ========================================================================== */
        .form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
            background: #000000; /* Very soft gray-blue */
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #000000;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form input {
            padding: 12px 16px;
            border: 1px solid #000000;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.25s ease;
            outline: none;
            background: #FFFFFF;
            color: var(--text-dark);
        }

        .form input:focus {
            border-color: var(--primary-glow);
            background: #ffffff;
            box-shadow: 0 0 12px rgba(180, 9, 143, 1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            grid-column: 1 / -1;
            margin-top: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        /* Royal Blue Add Button */
        .add-btn {
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            color: rgba(100, 0, 222, 1)white;
            flex: 2;
            box-shadow: 0 4px 15px rgba(100, 0, 222, 1);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 230, 1);
        }

        /* Sleek Slate & Blue Toggle rgba(0, 70, 223, 1)Button */
        .toggle-btn {
            background-color: rgba(55, 78, 231, 1);
            color: var(--deep-blue);
            border: 1px solid rgba(37, 99, 235, 0.15);
            flex: 1;
        }

        .toggle-btn:hover {
            background-color: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
        }

        /* ==========================================================================
           5. WHITE & BLUE TABLE DESIGN
           ========================================================================== */
        #tableContainer {
            overflow-x: auto;
#001CFF            border-radius: 12px;
            border: 1px solid #FBFBFB;
            background: #FFFFFF;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        table th {
            background-color: #C6C6C6; /* Soft blue header background */
            color: #1e40af;            /* Deep Blue header text */
            font-weight: 700;
            padding: 16px 20px;
            border-bottom: 2px solid #0675FF;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        table td {
            padding: 16px 20px;
            border-bottom: 1px solid #0080FF;
            color: #334155;
        }

        table tr:last-child td {
            border-bottom: none;
        }

        table tr {
            transition: background-color 0.2s ease;
        }

        table tr:hover {
            background-color: rgba(59, 130, 246, 0.03);
        }

        /* Styled Blue Badges for Table Content */
        .id-badge {
            font-family: monospace;
            background: rgba(37, 99, 235, 1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(37, 99, 235, 0.15);
            color: var(--accent-blue);
            font-weight: 600;
        }

        .course-badge {
            font-weight: 600;
            background: rgba(10, 55, 234, 1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            font-size: 12px;
            color: #475569;
        }

        .delete-btn {
            background-color: rgba(239, 68, 68, 0.08);
            color: #b91c1c;
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .delete-btn:hover {
            background-color: var(--danger-color);
            color: rgba(13, 187, 232, 1)white;
            border-color: var(--danger-color);
            box-shadow: 0 0 10px rgba(0, 92, 255, 1);
        }

        .no-data {
            text-align: center;
            color: #156EDD;
            padding: 40px !important;
            font-style: italic;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Record Registry</h1>
    <div class="subtitle">Securely record, manage, and monitor active student profiles</div>
    
    <!-- Status alert placeholder -->
    <div id="alert-container"></div>

    <!-- Student Input Panel -->
    <div class="form">
        <div class="form-group">
            <label for="studentID">Student ID</label>
            <input type="text" id="studentID" placeholder="e.g., 2026-0001">
        </div>

        <div class="form-group">
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" placeholder="e.g., Jane Doe">
        </div>

        <div class="form-group">
            <label for="course">Course</label>
            <input type="text" id="course" placeholder="e.g., BSIT">
        </div>
        
        <div class="button-group">
            <button class="add-btn" onclick="addStudent()">
                ➕ Add Student
            </button>
            <button class="toggle-btn" id="toggleButton" onclick="toggleRecords()">
                👁️ Hide Records
            </button>
        </div>
    </div>

    <!-- Records Output Table -->
    <div id="tableContainer">
        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">Student ID</th>
                    <th style="width: 40%;">Name</th>
                    <th style="width: 20%;">Course</th>
                    <th style="width: 15%; text-align: center;">Action</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                <tr>
                    <td colspan="4" class="no-data">No student records currently registered.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- ==========================================================================
     6. CORE APPLICATION LOGIC (JAVASCRIPT)
     ========================================================================== -->
<script>
    let studentRecords = [];
    let isTableVisible = true;

    function addStudent() {
        const idInput = document.getElementById('studentID');
        const nameInput = document.getElementById('studentName');
        const courseInput = document.getElementById('course');

        const idValue = idInput.value.trim();
        const nameValue = nameInput.value.trim();
        const courseValue = courseInput.value.trim();

        if (!idValue || !nameValue || !courseValue) {
            showAlert("Error: All input parameters are required.", "danger");
            return;
        }

        const isDuplicate = studentRecords.some(student => student.id.toLowerCase() === idValue.toLowerCase());
        if (isDuplicate) {
            showAlert(`Error: ID "${idValue}" has already been allocated.`, "danger");
            return;
        }

        const newStudent = {
            id: idValue,
            name: nameValue,
            course: courseValue
        };
        studentRecords.push(newStudent);

        displayStudents();
        showAlert(`Success: ${nameValue} has been registered to the database!`, "success");

        idInput.value = "";
        nameInput.value = "";
        courseInput.value = "";
        idInput.focus();
    }

    function displayStudents() {
        const tableBody = document.getElementById('studentTable');
        tableBody.innerHTML = ""; 

        if (studentRecords.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="4" class="no-data">No student records currently registered.</td></tr>`;
            return;
        }

        studentRecords.forEach((student, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><span class="id-badge">${escapeHtml(student.id)}</span></td>
                <td><strong>${escapeHtml(student.name)}</strong></td>
                <td><span class="course-badge">${escapeHtml(student.course)}</span></td>
                <td style="text-align: center;">
                    <button class="delete-btn" onclick="deleteStudent(${index})">Remove</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function deleteStudent(index) {
        const studentName = studentRecords[index].name;
        studentRecords.splice(index, 1);
        displayStudents();
        showAlert(`Removed: ${studentName}'s record has been cleared from registry.`, "danger");
    }

    function toggleRecords() {
        const tableContainer = document.getElementById('tableContainer');
        const toggleBtn = document.getElementById('toggleButton');
        
        isTableVisible = !isTableVisible;

        if (isTableVisible) {
            tableContainer.style.display = "block";
            toggleBtn.innerHTML = "👁️ Hide Records";
            showAlert("Registry view enabled.", "success");
        } else {
            tableContainer.style.display = "none";
            toggleBtn.innerHTML = "👁️ Show Records";
            showAlert("Registry view disabled.", "success");
        }
    }

    function showAlert(message, type) {
        const container = document.getElementById('alert-container');
        const alertClass = type === "success" ? "alert-success" : "alert-danger";
        
        container.innerHTML = `
            <div class="alert ${alertClass}">
                <span>${message}</span>
            </div>
        `;

        setTimeout(() => {
            const currentAlert = container.querySelector('.alert');
            if (currentAlert) {
                currentAlert.style.transition = "opacity 0.4s ease";
                currentAlert.style.opacity = "0";
                setTimeout(() => container.innerHTML = "", 400);
            }
        }, 4000);
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
</script>
</body>
</html>
